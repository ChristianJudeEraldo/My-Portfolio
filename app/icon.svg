<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <style>
    :root {
      --bg: #0c0c0e;
      --border: rgba(255, 255, 255, 0.12);
      --ink: #ffffff;
      --bracket: #55555c;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --border: rgba(0, 0, 0, 0.1);
        --ink: #0c0c0e;
        --bracket: #a1a1aa;
      }
    }
    .badge-bg { fill: var(--bg); stroke: var(--border); }
    .ink-fill { fill: var(--ink); }
    .bracket-stroke { stroke: var(--bracket); }
  </style>

  <!-- Squircle App Badge -->
  <rect class="badge-bg" x="1" y="1" width="30" height="30" rx="7" stroke-width="1.2"/>

  <!-- Precision Corner Brackets -->
  <path
    class="bracket-stroke"
    d="M 4.96 7.4 V 4.96 H 7.4 M 24.6 4.96 H 27.04 V 7.4 M 4.96 24.6 V 27.04 H 7.4 M 24.6 27.04 H 27.04 V 24.6"
    stroke-width="0.85"
    stroke-linecap="square"
  />

  <!-- Top bar of J -->
  <rect class="ink-fill" x="10.09" y="7.25" width="3.96" height="2.18"/>

  <!-- Bottom bar of E -->
  <polygon class="ink-fill" points="17.35,22.59 25.46,22.59 25.46,25.35 14.59,25.35"/>

  <!-- Circular Dot at Bottom-Left -->
  <circle class="ink-fill" cx="6.52" cy="25.45" r="0.74"/>

  <!-- Main Monogram Geometry (Fused JE) -->
  <path
    class="ink-fill"
    d="M 14.91 7.25 H 25.08 V 9.43 H 17.07 V 14.89 H 24.71 V 17.07 H 17.07 V 21.35 L 13.07 25.35 H 7.93 A 1.41 1.41 0 0 0 7.25 24.24 V 18.74 H 9.51 V 22.61 H 12.73 L 14.91 20.43 Z"
  />
</svg>