<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="pamiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="680" rx="20" fill="url(#pamiGrad)"/>
  
  <!-- Window Header -->
  <rect x="50" y="40" width="1100" height="600" rx="16" fill="#042f2e" stroke="#115e59" stroke-width="1.5"/>
  <circle cx="85" cy="72" r="7" fill="#ef4444"/>
  <circle cx="110" cy="72" r="7" fill="#f59e0b"/>
  <circle cx="135" cy="72" r="7" fill="#10b981"/>
  <text x="600" y="78" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" text-anchor="middle">aipamilihan.vercel.app — Pamilihan: Philippine Market Recipe Pricing</text>
  <line x1="50" y1="104" x2="1150" y2="104" stroke="#115e59" stroke-width="1"/>
  
  <!-- Left Column: Recipe Cost Estimator -->
  <rect x="90" y="140" width="500" height="450" rx="12" fill="#04201e" stroke="#134e4a" stroke-width="1.5"/>
  <text x="120" y="180" fill="#99f6e4" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Sinigang na Baboy (Pork Tamarind Soup)</text>
  <text x="120" y="205" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="13">Regional Price Grounding: Metro Manila (Divisoria Wet Market)</text>

  <!-- Ingredients List with unit prices -->
  <rect x="120" y="230" width="440" height="55" rx="8" fill="#064e3b" fill-opacity="0.5"/>
  <text x="140" y="263" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Pork Liempo (500g)</text>
  <text x="530" y="263" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="end">₱175.00</text>

  <rect x="120" y="295" width="440" height="55" rx="8" fill="#064e3b" fill-opacity="0.5"/>
  <text x="140" y="328" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Kangkong Bundle (2 bundles)</text>
  <text x="530" y="328" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="end">₱30.00</text>

  <rect x="120" y="360" width="440" height="55" rx="8" fill="#064e3b" fill-opacity="0.5"/>
  <text x="140" y="393" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Radish / Labanos (200g)</text>
  <text x="530" y="393" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="end">₱24.50</text>

  <rect x="120" y="425" width="440" height="55" rx="8" fill="#064e3b" fill-opacity="0.5"/>
  <text x="140" y="458" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Sampalok Mix &amp; Aromatics</text>
  <text x="530" y="458" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="end">₱35.00</text>

  <!-- Total Summary -->
  <line x1="120" y1="500" x2="560" y2="500" stroke="#134e4a" stroke-width="1.5"/>
  <text x="140" y="540" fill="#ccfbf1" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Calculated Recipe Cost (4 Servings):</text>
  <text x="530" y="540" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="end">₱264.50</text>
  <text x="530" y="565" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end">~₱66.12 / serving</text>

  <!-- Right Column: WFP HDX Data Engine -->
  <rect x="620" y="140" width="440" height="450" rx="12" fill="#04201e" stroke="#134e4a" stroke-width="1.5"/>
  <text x="650" y="180" fill="#99f6e4" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Deterministic Engine &amp; Market Feeds</text>
  
  <rect x="650" y="210" width="380" height="85" rx="10" fill="#064e3b" fill-opacity="0.4"/>
  <text x="670" y="240" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">SOURCE: WFP HUMANITARIAN DATA (HDX)</text>
  <text x="670" y="270" fill="#f0fdf4" font-family="system-ui, -apple-system, sans-serif" font-size="14">Commodity dataset updated across 17 Philippine regions</text>

  <rect x="650" y="315" width="380" height="85" rx="10" fill="#064e3b" fill-opacity="0.4"/>
  <text x="670" y="345" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">UNIT CONVERSION ENGINE</text>
  <text x="670" y="375" fill="#f0fdf4" font-family="system-ui, -apple-system, sans-serif" font-size="14">Auto-normalizes grams, bunches, pinches, and canned measures</text>

  <rect x="650" y="420" width="380" height="85" rx="10" fill="#064e3b" fill-opacity="0.4"/>
  <text x="670" y="450" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">AI RECIPE EXTRACTION</text>
  <text x="670" y="480" fill="#f0fdf4" font-family="system-ui, -apple-system, sans-serif" font-size="14">Extracts structured ingredients from natural language or URLs</text>

  <rect x="420" y="615" width="360" height="30" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="600" y="635" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Placeholder Screenshot · Replace with actual image later</text>
</svg>

