<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="subGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="680" rx="20" fill="url(#subGrad)"/>
  
  <!-- Window Header -->
  <rect x="50" y="40" width="1100" height="600" rx="16" fill="#131316" stroke="#27272a" stroke-width="1.5"/>
  <circle cx="85" cy="72" r="7" fill="#ef4444"/>
  <circle cx="110" cy="72" r="7" fill="#f59e0b"/>
  <circle cx="135" cy="72" r="7" fill="#10b981"/>
  <text x="600" y="78" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" text-anchor="middle">sub-tracer.vercel.app — SubTrace: Subscription &amp; Recurring Expense Tracker</text>
  <line x1="50" y1="104" x2="1150" y2="104" stroke="#27272a" stroke-width="1"/>

  <!-- Top Metrics Bar -->
  <g transform="translate(90, 130)">
    <!-- Metric 1: Monthly Run Rate -->
    <rect width="220" height="110" rx="14" fill="#1c1c21" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="35" fill="#a1a1aa" font-family="sans-serif" font-size="11" font-weight="600">MONTHLY RUN RATE</text>
    <text x="20" y="75" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="800">₱13,465.17</text>
    <text x="20" y="95" fill="#10b981" font-family="sans-serif" font-size="11">● 9 active subscriptions</text>

    <!-- Metric 2: Annual Commitment -->
    <rect x="250" width="220" height="110" rx="14" fill="#1c1c21" stroke="#27272a" stroke-width="1"/>
    <text x="270" y="35" fill="#a1a1aa" font-family="sans-serif" font-size="11" font-weight="600">ANNUAL OUTLAY</text>
    <text x="270" y="75" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="800">₱161,582.00</text>
    <text x="270" y="95" fill="#6366f1" font-family="sans-serif" font-size="11">Projected 12-month spend</text>

    <!-- Metric 3: Next 7 Days -->
    <rect x="500" width="220" height="110" rx="14" fill="#1c1c21" stroke="#27272a" stroke-width="1"/>
    <text x="520" y="35" fill="#a1a1aa" font-family="sans-serif" font-size="11" font-weight="600">DUE NEXT 7 DAYS</text>
    <text x="520" y="75" fill="#f59e0b" font-family="sans-serif" font-size="24" font-weight="800">₱8,350.00</text>
    <text x="520" y="95" fill="#f59e0b" font-family="sans-serif" font-size="11">1 upcoming renewal</text>

    <!-- Metric 4: Alerts -->
    <rect x="750" width="220" height="110" rx="14" fill="#1c1c21" stroke="#ef4444" stroke-width="1" stroke-opacity="0.4"/>
    <text x="770" y="35" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="700">PAYMENT ALERTS</text>
    <text x="770" y="75" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="800">8 Overdue</text>
    <text x="770" y="95" fill="#ef4444" font-family="sans-serif" font-size="11">Renewal attention required</text>
  </g>

  <!-- Subscription Cards Grid Mockup -->
  <g transform="translate(90, 270)">
    <!-- Sub 1 -->
    <rect width="305" height="150" rx="14" fill="#18181c" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="35" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">SAAS</text>
    <text x="20" y="65" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">OpenAI ChatGPT Plus</text>
    <text x="20" y="105" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">₱1,199.00<tspan font-size="12" fill="#71717a">/mo</tspan></text>
    <line x1="20" y1="120" x2="285" y2="120" stroke="#27272a"/>
    <text x="20" y="138" fill="#71717a" font-family="sans-serif" font-size="11">Auto-Renews Aug 15</text>
    <text x="285" y="138" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="end">Action Needed</text>

    <!-- Sub 2 -->
    <rect x="335" width="305" height="150" rx="14" fill="#18181c" stroke="#27272a" stroke-width="1"/>
    <text x="355" y="35" fill="#a855f7" font-family="sans-serif" font-size="11" font-weight="600">PRODUCTIVITY</text>
    <text x="355" y="65" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">GitHub Copilot Enterprise</text>
    <text x="355" y="105" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">₱1,100.00<tspan font-size="12" fill="#71717a">/mo</tspan></text>
    <line x1="355" y1="120" x2="620" y2="120" stroke="#27272a"/>
    <text x="355" y="138" fill="#71717a" font-family="sans-serif" font-size="11">Billed to Mastercard ••42</text>
    <text x="620" y="138" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="end">Active</text>

    <!-- Sub 3 -->
    <rect x="670" width="300" height="150" rx="14" fill="#18181c" stroke="#27272a" stroke-width="1"/>
    <text x="690" y="35" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="600">ENTERTAINMENT</text>
    <text x="690" y="65" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="700">Netflix Premium 4K</text>
    <text x="690" y="105" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">₱549.00<tspan font-size="12" fill="#71717a">/mo</tspan></text>
    <line x1="690" y1="120" x2="950" y2="120" stroke="#27272a"/>
    <text x="690" y="138" fill="#71717a" font-family="sans-serif" font-size="11">Family Plan (4 Screens)</text>
    <text x="950" y="138" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="end">Active</text>
  </g>

  <!-- Lower summary banner -->
  <rect x="90" y="450" width="970" height="140" rx="14" fill="#18181c" stroke="#27272a" stroke-width="1"/>
  <text x="120" y="490" fill="#f59e0b" font-family="sans-serif" font-size="15" font-weight="700">Burn Rate Optimization &amp; Renewal Calendar</text>
  <text x="120" y="520" fill="#d4d4d8" font-family="sans-serif" font-size="13">SubTrace aggregates your recurring cashflows across currencies into a clean, unified dashboard with renewal timelines and zero unexpected charges.</text>
  <text x="120" y="550" fill="#a1a1aa" font-family="sans-serif" font-size="12">Built with Next.js 16, Tailwind CSS, Local-First storage sync &amp; multi-currency calculation engine.</text>

  <rect x="420" y="615" width="360" height="30" rx="6" fill="#f59e0b" fill-opacity="0.2"/>
  <text x="600" y="635" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Placeholder Screenshot · Replace with actual image later</text>
</svg>

