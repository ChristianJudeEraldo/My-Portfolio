<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <style>
    :root {
      --bg: #09090b;
      --border: #27272a;
      --ink: #fafafa;
      --muted: #a1a1aa;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --border: #e4e4e7;
        --ink: #09090b;
        --muted: #71717a;
      }
    }
    .badge-bg { fill: var(--bg); stroke: var(--border); }
    .ink-stroke { stroke: var(--ink); }
    .ink-fill { fill: var(--ink); }
    .muted-fill { fill: var(--muted); }
    .muted-stroke { stroke: var(--muted); }
  </style>
  <rect class="badge-bg" x="1" y="1" width="30" height="30" rx="7" stroke-width="1.2"/>
  <circle class="muted-fill" cx="6.5" cy="6.5" r="0.85" opacity="0.75"/>
  <circle class="muted-fill" cx="25.5" cy="6.5" r="0.85" opacity="0.75"/>
  <circle class="muted-fill" cx="6.5" cy="25.5" r="0.85" opacity="0.75"/>
  <circle class="muted-fill" cx="25.5" cy="25.5" r="0.85" opacity="0.75"/>
  
  <path class="muted-stroke" d="M 14.5 9.5 H 11 C 9.6193 9.5 8.5 10.6193 8.5 12 V 15" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="ink-stroke" d="M 23.5 9.5 H 18.5 V 18 C 18.5 20.4853 16.4853 22.5 14 22.5 C 11.5147 22.5 9.5 20.4853 9.5 18" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="ink-fill" cx="23.5" cy="9.5" r="1.3"/>
</svg>